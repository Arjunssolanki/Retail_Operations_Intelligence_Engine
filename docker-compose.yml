
services:
  app:
    build: .
    container_name: retail_intelligence_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./mlruns:/app/mlruns
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow_tracking_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow ui --host 0.0.0.0 --port 5000
